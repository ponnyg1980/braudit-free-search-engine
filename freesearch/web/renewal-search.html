<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Check your trademark renewals — The Trademark Helpline</title>
<!--
  RENEWAL SEARCH (Jonathan, 7 Oct 2026). Website entry point for renewals,
  built like the Free Search box. Spec, verbatim:
    CTA: "Not sure whether you need to renew check your trademarks"
    The placeholder scrolls: "Type in your: Trademark Name, Trademark Number,
      Applicant Name or Applicant Number"
    "Want to speed up your search? Choose a Search Type" — ticking a type
      changes the placeholder to only what was selected ("Type your trademark
      name") and scrolls as normal.
    Whichever way, it searches Temmy/Heart and shows a list to select from.
  Data: GET /renewal-lookup (freesearch/renewals.py). Read-only.
  Band rules: _Hub/handoffs/RENEWAL_PROCESS_MAP_2026-10-03.md §3.
  NEXT (not built yet): the §8a actions on the selected marks.
-->

<script src="/demo-banner.js" defer></script>
<script src="/tool-events.js"></script>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:var(--font);color:var(--ink);background:transparent}
  .wrap{background:var(--white);border:1px solid var(--line);border-radius:var(--r-xl);
    box-shadow:var(--shadow);padding:22px 22px 18px;max-width:980px;margin:0 auto}
  body.embed .wrap{max-width:none}
  .eyebrow{font-family:var(--font-display);font-size:12px;font-weight:800;letter-spacing:1.4px;
    text-transform:uppercase;color:var(--pink);margin:0 0 6px}
  h1{margin:0 0 6px;font-size:1.55rem;font-weight:800;color:var(--navy);letter-spacing:-.4px}
  p.lead{margin:0 0 16px;font-size:.96rem;color:var(--slate);line-height:1.5}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  input[type=text]{flex:1 1 280px;min-width:0;padding:14px 16px;font-size:1.04rem;
    font-family:var(--font);border:2px solid #a9b8c5;border-radius:10px;color:var(--ink);
    background:#fff;font-weight:500;box-shadow:inset 0 1px 2px rgba(28,45,59,.06);
    transition:border-color .15s,box-shadow .15s}
  input[type=text]::placeholder{color:#4f5d6b;font-weight:400}
  input[type=text]:hover{border-color:var(--navy)}
  input[type=text]:focus{outline:none;border-color:var(--pink);box-shadow:0 0 0 4px rgba(229,22,82,.14)}
  button.go{flex:0 0 auto;padding:12px 26px;font-size:1rem;font-family:var(--font);font-weight:700;
    color:#fff;background:var(--pink);border:0;border-radius:10px;cursor:pointer;transition:background .15s ease}
  button.go:hover{background:var(--pink-hover)}
  button.go:disabled{opacity:.6;cursor:progress}
  @media (max-width:480px){ button.go{width:100%} }

  .types{margin:14px 0 0}
  .types .q{font-size:.88rem;color:var(--slate);margin:0 0 8px;font-weight:600}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border:1.5px solid var(--field-line);
    border-radius:var(--r-pill);font-size:.88rem;cursor:pointer;user-select:none;background:#fff;color:var(--navy)}
  .chip input{accent-color:var(--pink);margin:0}
  .chip:has(input:checked){border-color:var(--pink);background:var(--pink-tint)}
  .err{margin:12px 0 0;font-size:.9rem;color:var(--pink-dark);display:none}
  .err.on{display:block}

  /* results */
  #out{margin-top:18px}
  .loading{display:flex;align-items:center;gap:10px;color:var(--quiet);font-size:.92rem;padding:14px 2px}
  .spin{width:18px;height:18px;border:3px solid var(--line);border-top-color:var(--pink);border-radius:50%;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  h2.sec{font-size:1.05rem;color:var(--navy);margin:20px 0 10px;font-weight:800}
  /* Results open COMPRESSED (Jonathan, 7 Oct): one line per group with its
     count, e.g. Trademarks matching "Audi" (8); a click opens the list. */
  details.grp{border:1px solid var(--line);border-radius:var(--r-md);margin:10px 0;background:#fff}
  details.grp>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;
    gap:10px;padding:14px 16px;font-size:1.02rem;font-weight:800;color:var(--navy)}
  details.grp>summary::-webkit-details-marker{display:none}
  details.grp>summary:hover{background:var(--panel-soft)}
  details.grp>summary .n{color:var(--pink)}
  details.grp>summary::after{content:'+';font-size:1.3rem;font-weight:700;color:var(--pink);line-height:1}
  details.grp[open]>summary::after{content:'\2212'}
  details.grp[open]>summary{border-bottom:1px solid var(--line)}
  details.grp>.body{padding:12px 14px 14px}
  .hint{font-size:.85rem;color:var(--quiet)}
  .owners{display:grid;gap:8px}
  .owner{display:flex;gap:12px;align-items:center;justify-content:space-between;border:1px solid var(--line);
    border-radius:var(--r-md);padding:12px 14px;background:var(--panel-soft)}
  .owner b{color:var(--navy)}
  .owner button{flex:0 0 auto;padding:8px 14px;border-radius:8px;border:1.5px solid var(--navy);background:#fff;
    color:var(--navy);font-weight:700;font-family:var(--font);cursor:pointer}
  .owner button:hover{background:var(--navy);color:#fff}
  .owner.open{border-color:var(--navy)}

  .marks{display:grid;gap:8px}
  .mark{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;border:1px solid var(--line);
    border-radius:var(--r-md);padding:12px 14px;background:#fff;cursor:pointer}
  .mark:hover{border-color:#b9c4ce}
  .mark.sel{border-color:var(--pink);background:var(--pink-tint)}
  .mark.dis{cursor:default;background:var(--panel-soft)}
  .mark input{width:18px;height:18px;margin-top:3px;accent-color:var(--pink)}
  .mark .nm{font-weight:800;color:var(--navy);font-size:1rem}
  .mark .meta{font-size:.84rem;color:var(--slate);margin-top:3px;line-height:1.45}
  .mark .say{font-size:.84rem;color:var(--quiet);margin-top:5px}
  .badge{display:inline-block;font-size:.76rem;font-weight:800;padding:4px 10px;border-radius:var(--r-pill);white-space:nowrap}
  .t-urgent{background:var(--pill-high-bg);color:var(--pill-high-fg)}
  .t-soon{background:var(--pill-med-bg);color:var(--pill-med-fg)}
  .t-ok{background:var(--pill-low-bg);color:var(--pill-low-fg)}
  .t-ended,.t-info{background:var(--pill-neg-bg);color:var(--pill-neg-fg)}
  .exp{font-size:.8rem;color:var(--quiet);text-align:right;margin-top:6px}
  details.more{margin-top:10px}
  details.more summary{cursor:pointer;color:var(--navy);font-weight:700;font-size:.9rem;padding:6px 0}
  .empty{padding:14px;border:1px dashed var(--pink-line);border-radius:var(--r-md);color:var(--slate);font-size:.92rem;background:var(--pink-tint)}

  .selbar{position:sticky;bottom:0;margin-top:16px;display:none;align-items:center;justify-content:space-between;gap:12px;
    background:var(--navy);color:#fff;border-radius:var(--r-md);padding:12px 16px;box-shadow:var(--shadow)}
  .selbar.on{display:flex}
  .selbar b{font-size:1rem}
  .selbar span{color:var(--on-navy);font-size:.86rem}
  .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .btn{padding:7px 13px;border-radius:8px;border:1.5px solid var(--navy);background:#fff;color:var(--navy);
    font-weight:700;font-size:.84rem;font-family:var(--font);cursor:pointer;transition:background .15s ease}
  .btn:hover{background:var(--navy);color:#fff}
  .btn.pink{border-color:var(--pink);background:var(--pink);color:#fff}
  .btn.pink:hover{background:var(--pink-hover)}
  .back{background:none;border:0;color:var(--pink);font-weight:700;font-family:var(--font);font-size:.92rem;cursor:pointer;padding:0;margin:0 0 14px}
  /* trademark page */
  .tmhead{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
  .tmhead h1{margin:2px 0 4px}
  .tmimg{max-width:140px;max-height:110px;border:1px solid var(--line);border-radius:10px;padding:6px;background:#fff}
  .rband{border-radius:var(--r-md);padding:14px 16px;margin:16px 0;border:1px solid var(--line);background:var(--panel-soft)}
  .rband.t-urgent{border-color:#f0b9ae;background:#fff6f4}
  .rband.t-soon{border-color:#efd9a2;background:#fffbf0}
  .rband.t-ok{border-color:#bfe3cf;background:#f4fbf7}
  .sect{border:1px solid var(--line);border-radius:var(--r-md);margin:12px 0;overflow:hidden}
  .sect h3{margin:0;padding:12px 16px;font-size:.98rem;color:var(--navy);background:var(--panel);border-bottom:1px solid var(--line)}
  .sect .in{padding:12px 16px}
  dl.kv{display:grid;grid-template-columns:200px 1fr;gap:8px 16px;margin:0;font-size:.92rem}
  dl.kv dt{color:var(--quiet)} dl.kv dd{margin:0;color:var(--ink);font-weight:600}
  .cls{padding:10px 0;border-top:1px solid var(--line)} .cls:first-child{border-top:0;padding-top:0}
  .cls b{color:var(--navy)} .cls p{margin:4px 0 0;font-size:.9rem;line-height:1.5;color:var(--slate)}
  /* portfolio */
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
  .tile{border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;background:#fff}
  .tile .v{font-size:1.6rem;font-weight:800;color:var(--navy);font-family:var(--font-display)}
  .tile .l{font-size:.82rem;color:var(--quiet)}
  .tile.urgent{border-color:#f0b9ae} .tile.urgent .v{color:var(--pill-high-fg)}
  .tile.soon .v{color:var(--pill-med-fg)}
  .seg{display:inline-flex;border:1.5px solid var(--navy);border-radius:10px;overflow:hidden;margin:4px 0 6px}
  .seg button{border:0;background:#fff;color:var(--navy);font-weight:700;font-family:var(--font);padding:8px 16px;cursor:pointer}
  .seg button.on{background:var(--navy);color:#fff}
  .pcard{border:1px solid var(--line);border-radius:var(--r-md);margin:12px 0;overflow:hidden;background:#fff}
  .pcard.urgent{border:1.5px solid #e9a597}
  .pcard>h3{margin:0;padding:12px 16px;font-size:.98rem;color:var(--navy);background:var(--panel);border-bottom:1px solid var(--line);
    display:flex;justify-content:space-between;gap:10px}
  .pcard.urgent>h3{background:#fff6f4}
  .pcard .sub{font-weight:400;color:var(--quiet);font-size:.84rem}
  table.pt{width:100%;border-collapse:collapse;font-size:.88rem}
  table.pt th{text-align:left;font-size:.78rem;color:var(--quiet);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  table.pt th.s{cursor:pointer} table.pt th.s:hover{color:var(--navy)}
  table.pt td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
  table.pt tr:last-child td{border-bottom:0}
  table.pt tr.sel td{background:var(--pink-tint)}
  table.pt td{white-space:nowrap}
  table.pt td.nm{font-weight:800;color:var(--navy);white-space:normal}
  table.pt input{width:17px;height:17px;accent-color:var(--pink)}
  .tscroll{overflow-x:auto}
  @media (max-width:560px){ dl.kv{grid-template-columns:1fr} .hide-sm{display:none} }
  @media (max-width:560px){ .mark{grid-template-columns:auto 1fr} .mark .right{grid-column:2} .exp{text-align:left} }
</style>

<body>
<div class="wrap">
 <div id="searchView">
  <p class="eyebrow">Trademark renewals</p>
  <h1>Not sure whether you need to renew?</h1>
  <p class="lead">Check your trademarks. Search the UK register and we will show you when each mark is due for renewal and what to do next.</p>

  <div class="row">
    <input id="q" type="text" autocomplete="off" aria-label="Trademark name, trademark number, applicant name or applicant number"
           placeholder="Type in your trademark name, trademark number, applicant name or applicant number">
    <button id="go" class="go" type="button">Check my trademarks</button>
  </div>

  <div class="types">
    <p class="q">Want to speed up your search? Choose a search type</p>
    <div class="chips" id="types">
      <label class="chip"><input type="checkbox" value="mark_name">Trademark Name</label>
      <label class="chip"><input type="checkbox" value="mark_number">Trademark Number</label>
      <label class="chip"><input type="checkbox" value="applicant_name">Applicant Name</label>
      <label class="chip"><input type="checkbox" value="applicant_number">Applicant Number</label>
    </div>
  </div>
  <p class="err" id="err" role="alert"></p>

  <div id="out" aria-live="polite"></div>
 </div>
 <div id="view" aria-live="polite" hidden></div>

  <div class="selbar" id="selbar">
    <div><b id="selcount">0 marks selected</b><br><span>Next you will choose how to renew them.</span></div>
  </div>

  <div data-tmh-help="strip" data-temmy="question" style="margin-top:22px"
       data-help-title="Need some help with a renewal?"></div>
</div>
<script src="/help-line.js" defer></script>

<script>
const P = new URLSearchParams(location.search);
if (P.get('embed') === '1') document.body.classList.add('embed');
const LABEL = {mark_name:'Trademark Name', mark_number:'Trademark Number',
               applicant_name:'Applicant Name', applicant_number:'Applicant Number'};
const elQ = document.getElementById('q'), elGo = document.getElementById('go'),
      elErr = document.getElementById('err'), elOut = document.getElementById('out');
const selected = new Map();          // number -> mark

function chosen(){ return [...document.querySelectorAll('#types input:checked')].map(i=>i.value); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmtDate(iso){ if(!iso) return ''; const d=new Date(iso+'T00:00:00');
  return isNaN(d)?iso:d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); }

/* ---- the placeholder scrolls ---------------------------------------------
   No type ticked: "Type in your Trademark Name" -> "...Trademark Number" ->
   "...Applicant Name" -> "...Applicant Number", typed and deleted in turn.
   Types ticked: only those, and the static text names only those
   ("Type your trademark name"). Same rules as the Free Search box: it never
   touches the value, stops on focus or typing, honours reduced motion, and
   idles in a hidden tab. */
const Typer = (function(){
  let words = [], prefix = '', w = 0, i = 0, del = false, timer = null, stopped = false;
  let reduced = false;
  try{ reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}
  function staticText(){
    const c = chosen();
    if(!c.length) return 'Type in your trademark name, trademark number, applicant name or applicant number';
    const names = c.map(k=>LABEL[k].toLowerCase());
    return 'Type your ' + (names.length===1 ? names[0] : names.slice(0,-1).join(', ') + ' or ' + names[names.length-1]);
  }
  function setup(){
    const c = chosen();
    words = (c.length ? c : Object.keys(LABEL)).map(k=>LABEL[k]);
    prefix = c.length ? 'Type your ' : 'Type in your ';
    if(c.length) words = words.map(x=>x.toLowerCase());
    w = 0; i = 0; del = false;
  }
  function tick(){
    if(stopped) return;
    if(document.hidden){ timer = setTimeout(tick, 600); return; }
    const word = words[w];
    i = del ? i - 1 : i + 1;
    elQ.setAttribute('placeholder', prefix + word.slice(0, i) + (del ? '' : '…'));
    let wait = del ? 35 : 70;
    if(!del && i === word.length){ del = true; wait = 1300; }
    else if(del && i === 0){ del = false; w = (w + 1) % words.length; wait = 240; }
    timer = setTimeout(tick, wait);
  }
  function start(){
    if(timer) clearTimeout(timer);
    elQ.setAttribute('placeholder', staticText());
    if(reduced || stopped) return;
    setup(); timer = setTimeout(tick, 700);
  }
  function stop(){ stopped = true; if(timer) clearTimeout(timer); elQ.setAttribute('placeholder', staticText()); }
  ['focus','input','keydown','paste'].forEach(ev=>elQ.addEventListener(ev, stop, {once:true}));
  return {start, restart(){ if(stopped){ elQ.setAttribute('placeholder', staticText()); } else start(); }};
})();
document.querySelectorAll('#types input').forEach(i=>i.addEventListener('change', ()=>Typer.restart()));
Typer.start();

/* ---- search ------------------------------------------------------------ */
function fail(msg){ elErr.textContent = msg; elErr.classList.add('on'); }
async function lookup(q, types){
  const u = '/renewal-lookup?q=' + encodeURIComponent(q) + (types.length ? '&types=' + types.join(',') : '');
  const r = await fetch(u); return r.json();
}

async function run(){
  const q = (elQ.value||'').trim();
  if(q.length < 2){ elQ.focus(); fail('Type at least two characters to search.'); return; }
  elErr.classList.remove('on');
  elGo.disabled = true; elGo.textContent = 'Checking…';
  elOut.innerHTML = '<div class="loading"><div class="spin"></div>Searching the UK register…</div>';
  if(window.tmhTool) tmhTool.step('search_submitted');
  let d;
  try{ d = await lookup(q, chosen()); }catch(e){ d = {ok:false, error:'We could not reach the register just now. Please try again.'}; }
  elGo.disabled = false; elGo.textContent = 'Check my trademarks';
  if(!d || !d.ok){ elOut.innerHTML = ''; fail((d && d.error) || 'Something went wrong. Please try again.'); return; }
  render(d);
  if(window.tmhTool) tmhTool.step('results_shown');
}

function markCard(m){
  const b = m.band || {}, can = !!b.renewable_online, on = selected.has(m.number);
  const cls = (m.classes||[]).length ? 'Class' + (m.classes.length>1?'es ':' ') + m.classes.join(', ') : '';
  const expLine = m.expiry_date ? (b.key==='late'||b.key==='removed' ? 'Expired ' : 'Expires ') + fmtDate(m.expiry_date) : '';
  return '<div class="mark'+(on?' sel':'')+(can?'':' dis')+'" data-n="'+esc(m.number)+'">'+
    (can ? '<input type="checkbox" aria-label="Select '+esc(m.name)+'"'+(on?' checked':'')+'>' : '<span></span>')+
    '<div><div class="nm">'+esc(m.name)+'</div>'+
      '<div class="meta">'+esc(m.number)+(m.applicant?' &middot; '+esc(m.applicant):'')+(cls?' &middot; '+esc(cls):'')+'</div>'+
      '<div class="say">'+esc(b.say||'')+'</div>'+
      '<div class="acts"><button type="button" class="btn" data-act="mark" data-n="'+esc(m.number)+'">View this trademark</button>'+
      '<button type="button" class="btn" data-act="all" data-n="'+esc(m.number)+'">View all trademarks</button></div></div>'+
    '<div class="right"><span class="badge t-'+esc(b.tone||'info')+'">'+esc(b.label||'')+'</span>'+
      '<div class="exp">'+esc(expLine)+'</div></div></div>';
}

let MARKS = {};
function marksBlock(list, title){
  list.forEach(m=>{ MARKS[m.number] = m; });
  const live = list.filter(m=>m.band && m.band.renewable_online),
        rest = list.filter(m=>!(m.band && m.band.renewable_online));
  let h = title ? '<h2 class="sec">'+title+'</h2>' : '';
  if(live.length){
    h += '<p class="hint">Tick the marks you want to renew.</p><div class="marks">'+live.map(markCard).join('')+'</div>';
  } else if(rest.length){
    h += '<div class="empty">None of these marks can be renewed online. Have a look below, or talk to us and we will check them for you.</div>';
  }
  if(rest.length){
    h += '<details class="more"'+(live.length?'':' open')+'><summary>'+rest.length+' mark'+(rest.length>1?'s':'')+
         ' that can’t be renewed online</summary><div class="marks">'+rest.map(markCard).join('')+'</div></details>';
  }
  return h;
}

function group(title, count, body, open){
  return '<details class="grp"'+(open?' open':'')+'><summary><span>'+title+' <span class="n">('+count+')</span></span></summary>'+
         '<div class="body">'+body+'</div></details>';
}
function render(d){
  MARKS = {};
  let h = '';
  const byNum = (d.marks||[]).filter(m=>m.matched_by==='mark_number'),
        byName = (d.marks||[]).filter(m=>m.matched_by==='mark_name'),
        byOwner = (d.marks||[]).filter(m=>m.matched_by==='applicant_number');
  if(byNum.length) h += group('Trademark number match', byNum.length, marksBlock(byNum, ''), true);
  if(byName.length) h += group('Trademarks matching \u201c'+esc(d.query)+'\u201d', byName.length, marksBlock(byName, ''), false);
  if(byOwner.length) h += group('Trademarks owned by '+esc(d.owner && d.owner.name || 'this applicant') +
                           (d.owner && d.owner.ipo_identifier ? ' <span class="hint">(applicant '+esc(d.owner.ipo_identifier)+')</span>' : ''),
                           byOwner.length, marksBlock(byOwner, ''), !byNum.length);
  if((d.owners||[]).length){
    h += group('Applicants matching \u201c'+esc(d.query)+'\u201d', d.owners.length,
         '<p class="hint" style="margin-top:0">One business can appear more than once on the register. Open each to see its trademarks.</p><div class="owners">'+
         d.owners.map(o=>'<div class="owner" data-ipo="'+esc(o.ipo_identifier)+'"><div><b>'+esc(o.name)+'</b><div class="hint">'+
            esc([o.address,o.postcode].filter(Boolean).join(', '))+' &middot; applicant '+esc(o.ipo_identifier)+' &middot; '+
            o.trademark_count+' trademark'+(o.trademark_count===1?'':'s')+'</div></div>'+
            '<button type="button" data-act="owner" data-ipo="'+esc(o.ipo_identifier)+'">Show trademarks</button></div>').join('')+'</div>', false);
  }
  if(!h){
    h = '<div class="empty">We couldn’t find anything for “'+esc(d.query)+'”'+
        (d.types && d.types.length ? ' as a '+d.types.map(t=>LABEL[t].toLowerCase()).join(' or ') : '')+
        '. Check the spelling, try another search type, or talk to us and we will find it for you.</div>';
  }
  if((d.failed||[]).length) h += '<p class="hint">Part of the search did not complete. Try again in a moment.</p>';
  elOut.innerHTML = h;
  syncSel();
}

/* actions: View this trademark / View all trademarks / Show trademarks */
document.addEventListener('click', function(e){
  const a = e.target.closest('[data-act]');
  if(!a) return;
  e.preventDefault(); e.stopPropagation();
  const act = a.dataset.act;
  if(act==='mark') go({view:'mark', n:a.dataset.n});
  else if(act==='all') go({view:'portfolio', n:a.dataset.n});
  else if(act==='owner') go({view:'portfolio', ipo:a.dataset.ipo});
  else if(act==='back'){
    if(NAV > 0){ history.back(); }
    else { const u = new URL(location.href); ['mark','ipo','pn'].forEach(k=>u.searchParams.delete(k));
           history.pushState({view:'search'}, '', u); show({view:'search'}); }
  }
  else if(act==='prio' || act==='list'){ PVIEW = act; drawPortfolio(); }
  else if(act==='sort'){ const k=a.dataset.k; PSORT = {k, d: PSORT.k===k ? -PSORT.d : 1}; drawPortfolio(); }
}, true);

elOut.addEventListener('click', async function(e){
  const row = e.target.closest('.mark');
  if(!row || row.classList.contains('dis')) return;
  const n = row.dataset.n, cb = row.querySelector('input');
  if(e.target !== cb) cb.checked = !cb.checked;
  if(cb.checked) selected.set(n, MARKS[n]); else selected.delete(n);
  syncSel();
});

function syncSel(){
  document.querySelectorAll('.mark[data-n], tr[data-n]').forEach(r=>{
    const on = selected.has(r.dataset.n); r.classList.toggle('sel', on);
    const cb = r.querySelector('input'); if(cb) cb.checked = on;
  });
  const n = selected.size;
  document.getElementById('selcount').textContent = n + ' mark' + (n===1?'':'s') + ' selected';
  document.getElementById('selbar').classList.toggle('on', n > 0);
  window.RENEWAL_SELECTED = [...selected.values()];     // for the next step (§8a)
}


/* ===== VIEWS (Jonathan, 7 Oct) =========================================
   "View this trademark"  -> every section of the mark, NEVER the representative
   "View all trademarks"  -> the owner's portfolio in the Temmy Portal's
                             Priority View (who needs you first), with a List
                             View toggle. "Show trademarks" on an applicant
                             opens the same portfolio.
   Views live in the URL (?mark= / ?ipo= / ?pn=) so Back works and a view can
   be linked to. The search results stay in the page underneath. */
const elView = document.getElementById('view'), elSearch = document.getElementById('searchView');
let PF = null, PVIEW = 'prio', PSORT = {k:'expiry', d:1};
let NAV = 0;     // views opened from inside the page; Back steps through them

function go(st){
  const u = new URL(location.href);
  ['mark','ipo','pn'].forEach(k=>u.searchParams.delete(k));
  if(st.view==='mark') u.searchParams.set('mark', st.n);
  if(st.view==='portfolio'){ if(st.ipo) u.searchParams.set('ipo', st.ipo); else u.searchParams.set('pn', st.n); }
  history.pushState(st, '', u); NAV++;
  show(st);
}
window.addEventListener('popstate', e=>{ if(NAV>0) NAV--; show(e.state || stateFromUrl()); });
function stateFromUrl(){
  const q = new URLSearchParams(location.search);
  if(q.get('mark')) return {view:'mark', n:q.get('mark')};
  if(q.get('ipo')) return {view:'portfolio', ipo:q.get('ipo')};
  if(q.get('pn')) return {view:'portfolio', n:q.get('pn')};
  return {view:'search'};
}
function scrollUp(){ try{ window.parent.postMessage({brauditScrollTop:true}, '*'); }catch(e){} window.scrollTo(0,0); }
function loadingView(msg){ elView.innerHTML = '<div class="loading"><div class="spin"></div>'+msg+'</div>'; }
function backBtn(){ return '<button type="button" class="back" data-act="back">← Back</button>'; }

async function show(st){
  if(!st || st.view==='search'){ elView.hidden = true; elView.innerHTML = ''; elSearch.hidden = false; syncSel(); return; }
  elSearch.hidden = true; elView.hidden = false; scrollUp();
  if(st.view==='mark'){
    loadingView('Loading the trademark…');
    let d; try{ d = await (await fetch('/renewal-lookup?action=mark&number='+encodeURIComponent(st.n))).json(); }catch(e){ d = null; }
    if(!d || !d.ok){ elView.innerHTML = backBtn()+'<div class="empty">'+esc((d&&d.error)||'We could not load that trademark. Please try again.')+'</div>'; return; }
    drawMark(d.mark);
  } else {
    loadingView('Loading the portfolio…');
    const qs = st.ipo ? 'ipo='+encodeURIComponent(st.ipo) : 'number='+encodeURIComponent(st.n);
    let d; try{ d = await (await fetch('/renewal-lookup?action=portfolio&'+qs)).json(); }catch(e){ d = null; }
    if(!d || !d.ok){ elView.innerHTML = backBtn()+'<div class="empty">'+esc((d&&d.error)||'We could not load the portfolio. Please try again.')+'</div>'; return; }
    PF = d; PVIEW = 'prio'; (d.marks||[]).forEach(m=>{ MARKS[m.number] = m; });
    drawPortfolio();
  }
}

function kv(rows){ rows = rows.filter(r=>r[1]); return rows.length ? '<dl class="kv">'+rows.map(r=>'<dt>'+r[0]+'</dt><dd>'+r[1]+'</dd>').join('')+'</dl>' : '<p class="hint">Not recorded.</p>'; }
function sect(title, body){ return '<div class="sect"><h3>'+title+'</h3><div class="in">'+body+'</div></div>'; }

function drawMark(m){
  const b = m.band || {}, dt = m.dates || {};
  MARKS[m.number] = MARKS[m.number] || {number:m.number, name:m.name, band:b, classes:(m.classes||[]).map(c=>c.n),
                                        expiry_date:dt.expiry, applicant:(m.owners[0]||{}).name||''};
  const can = !!b.renewable_online, on = selected.has(m.number);
  let h = backBtn()+'<div class="tmhead"><div><p class="eyebrow">Trademark '+esc(m.number)+'</p><h1>'+esc(m.name)+'</h1>'+
    '<span class="badge t-'+esc(b.tone||'info')+'">'+esc(b.label||'')+'</span> <span class="hint">Register status: '+esc(m.status||'Unknown')+'</span></div>'+
    (m.image_url ? '<img class="tmimg" src="'+esc(m.image_url)+'" alt="">' : '')+'</div>';
  h += '<div class="rband t-'+esc(b.tone||'info')+'"><b>'+esc(b.label||'')+'</b><div style="margin-top:4px">'+esc(b.say||'')+'</div>'+
    (b.expiry ? '<div class="hint" style="margin-top:6px">Renewal date '+fmtDate(b.expiry)+
      (b.renewable_online ? ' &middot; UKIPO renewal window opens '+fmtDate(b.window_opens)+' &middot; late renewal possible until '+fmtDate(b.late_until) : '')+'</div>' : '')+
    '<div class="acts">'+(can ? '<label class="btn'+(on?' pink':'')+'" style="display:inline-flex;gap:8px;align-items:center"><input type="checkbox" data-sel="'+esc(m.number)+'"'+(on?' checked':'')+'> Select for renewal</label>' : '')+
    '<button type="button" class="btn" data-act="all" data-n="'+esc(m.number)+'">View all trademarks</button></div></div>';
  h += sect('Trademark details', kv([['Trademark', esc(m.name)], ['Number', esc(m.number)], ['Type of mark', esc(m.feature)],
        ['Kind', esc(m.kind)], ['Description', esc(m.description)], ['Status on the register', esc(m.status)]]));
  h += sect('Key dates', kv([['Filed', fmtDate(dt.filed)], ['Published', fmtDate(dt.published)], ['Registered', fmtDate(dt.registered)],
        ['Renewal (expiry) date', fmtDate(dt.expiry)], ['Last updated on the register', fmtDate(dt.last_updated)]]));
  h += sect('Owner'+((m.owners||[]).length>1?'s':''), (m.owners||[]).map(o=>kv([['Name', esc(o.name)], ['Applicant number', esc(o.ipo_identifier)],
        ['Type', esc(o.kind)], ['Company number', esc(o.company_number)], ['Address', esc(o.address)]])).join('<hr style="border:0;border-top:1px solid var(--line);margin:12px 0">') || '<p class="hint">Not recorded.</p>');
  h += sect('Classes, goods and services ('+(m.classes||[]).length+')', (m.classes||[]).map(c=>'<div class="cls"><b>Class '+c.n+'</b>'+
        (c.heading?' <span class="hint">'+esc(c.heading)+'</span>':'')+(c.spec?'<p>'+esc(c.spec)+'</p>':'')+'</div>').join('') || '<p class="hint">Not recorded.</p>');
  h += sect('Register history', (m.history||[]).length ? kv(m.history.map(x=>[fmtDate(x.date), esc(x.state)])) : '<p class="hint">No history recorded.</p>');
  h += '<p class="hint" style="margin-top:10px">Source: the UK trademark register. <a href="'+esc(m.ukipo_url)+'" target="_blank" rel="noopener">View on the UKIPO site</a></p>';
  elView.innerHTML = h; syncSel();
}

const PGROUPS = [
  {id:'action', title:'Action required', sub:'Renew now, or expired and still renewable', keys:['renew_now','late'], urgent:true},
  {id:'soon', title:'Renewal approaching', sub:'Due within the next 12 months', keys:['approaching']},
  {id:'ok', title:'Registered, not yet due', sub:'More than 12 months to go', keys:['not_yet_due']},
  {id:'apps', title:'Applications', sub:'Not registered yet, nothing to renew', keys:['pending']},
  {id:'ended', title:'Expired, removed or not live', sub:'Can’t be renewed online', keys:['removed','not_live','unknown'], closed:true},
];
function prow(m){
  const b = m.band||{}, can = !!b.renewable_online, on = selected.has(m.number);
  return '<tr data-n="'+esc(m.number)+'"'+(on?' class="sel"':'')+'><td>'+(can?'<input type="checkbox" data-sel="'+esc(m.number)+'"'+(on?' checked':'')+' aria-label="Select '+esc(m.name)+'">':'')+'</td>'+
    '<td><span class="badge t-'+esc(b.tone||'info')+'">'+esc(b.label||'')+'</span></td>'+
    '<td class="nm">'+esc(m.name)+'</td><td>'+esc(m.number)+'</td>'+
    '<td class="hide-sm">'+esc((m.classes||[]).join(', '))+'</td>'+
    '<td class="hide-sm">'+fmtDate(m.application_date)+'</td>'+
    '<td>'+fmtDate(m.expiry_date)+'</td>'+
    '<td><button type="button" class="btn" data-act="mark" data-n="'+esc(m.number)+'">View</button></td></tr>';
}
function ptable(list, sortable){
  const th = (k,l,cls)=>'<th'+(sortable?' class="s'+(cls?' '+cls:'')+'" data-act="sort" data-k="'+k+'"':(cls?' class="'+cls+'"':''))+'>'+l+
      (sortable && PSORT.k===k ? (PSORT.d>0?' ↑':' ↓') : '')+'</th>';
  return '<div class="tscroll"><table class="pt"><thead><tr><th></th>'+th('band','Status')+th('name','Name')+th('number','Number')+
    th('classes','Classes','hide-sm')+th('filed','Filed','hide-sm')+th('expiry','Renewal date')+'<th></th></tr></thead><tbody>'+
    list.map(prow).join('')+'</tbody></table></div>';
}
function drawPortfolio(){
  const d = PF, o = d.owner||{}, ms = d.marks||[], c = d.counts||{};
  const n = k=>k.reduce((a,x)=>a+(c[x]||0),0);
  let h = backBtn()+'<p class="eyebrow">Portfolio</p><h1>'+esc(o.name||'Applicant')+'</h1>'+
    '<p class="hint" style="margin:0">Applicant '+esc(o.ipo_identifier)+(o.address?' &middot; '+esc(o.address):'')+(o.postcode?', '+esc(o.postcode):'')+
    ' &middot; '+ms.length+' trademark'+(ms.length===1?'':'s')+' on the UK register</p>';
  if((d.other_owners||[]).length) h += '<p class="hint">This mark is jointly owned. Also see: '+d.other_owners.map(x=>'<a href="#" data-act="owner" data-ipo="'+esc(x.ipo_identifier)+'">'+esc(x.name)+'</a>').join(', ')+'</p>';
  h += '<div class="tiles">'+
    '<div class="tile urgent"><div class="v">'+n(['renew_now','late'])+'</div><div class="l">Need action now</div></div>'+
    '<div class="tile soon"><div class="v">'+n(['approaching'])+'</div><div class="l">Due within 12 months</div></div>'+
    '<div class="tile"><div class="v">'+n(['not_yet_due'])+'</div><div class="l">Registered, not yet due</div></div>'+
    '<div class="tile"><div class="v">'+n(['removed','not_live','unknown','pending'])+'</div><div class="l">Applications, expired or removed</div></div></div>';
  h += '<div class="seg"><button type="button" data-act="prio" class="'+(PVIEW==='prio'?'on':'')+'">Priority View</button>'+
       '<button type="button" data-act="list" class="'+(PVIEW==='list'?'on':'')+'">List View</button></div>';
  if(PVIEW==='prio'){
    PGROUPS.forEach(g=>{
      const list = ms.filter(m=>g.keys.includes((m.band||{}).key));
      if(!list.length) return;
      const body = ptable(list, false);
      h += g.closed ? '<details class="grp"><summary><span>'+g.title+' <span class="n">('+list.length+')</span></span></summary><div class="body" style="padding:0">'+body+'</div></details>'
                    : '<div class="pcard'+(g.urgent?' urgent':'')+'"><h3><span>'+g.title+' ('+list.length+')</span><span class="sub">'+g.sub+'</span></h3>'+body+'</div>';
    });
  } else {
    const key = {band:m=>(m.band||{}).order, name:m=>m.name.toLowerCase(), number:m=>m.number, classes:m=>(m.classes||[])[0]||99,
                 filed:m=>m.application_date||'', expiry:m=>m.expiry_date||'9999'}[PSORT.k] || (m=>m.expiry_date||'');
    const list = ms.slice().sort((a,b)=>{ const x=key(a), y=key(b); return (x>y?1:x<y?-1:0)*PSORT.d; });
    h += '<div class="pcard">'+ptable(list, true)+'</div>';
  }
  elView.innerHTML = h; syncSel();
}

/* ticking in the trademark page / portfolio tables */
document.addEventListener('change', function(e){
  const cb = e.target.closest('input[data-sel]'); if(!cb) return;
  const n = cb.dataset.sel;
  if(cb.checked) selected.set(n, MARKS[n] || {number:n}); else selected.delete(n);
  syncSel();
  if(cb.closest('label.btn')) cb.closest('label.btn').classList.toggle('pink', cb.checked);
});

elGo.addEventListener('click', run);
elQ.addEventListener('keydown', e=>{ if(e.key === 'Enter') run(); });

/* deep link: ?q=...&types=... runs straight away (WordPress hand-off later) */
(function(){
  const q = P.get('q'), t = (P.get('types')||'').split(',').filter(Boolean);
  t.forEach(v=>{ const i = document.querySelector('#types input[value="'+v+'"]'); if(i) i.checked = true; });
  if(t.length) Typer.restart();
  if(q){ elQ.value = q; run(); }
  const st = stateFromUrl();
  if(st.view !== 'search'){ history.replaceState(st, '', location.href); show(st); }
})();

/* embed.js contract: report height, and ready once drawn */
(function(){
  function send(){ const h = Math.ceil(document.querySelector('.wrap').getBoundingClientRect().height + 8);
    try{ window.parent.postMessage({brauditHeight:h}, '*'); }catch(e){} }
  try{ new ResizeObserver(send).observe(document.querySelector('.wrap')); }catch(e){ setInterval(send, 800); }
  window.addEventListener('load', function(){ send(); try{ window.parent.postMessage({brauditReady:true}, '*'); }catch(e){} });
})();
</script>
</body>
